# Chirpy 站点配置（中文说明）
# 修改本文件后，本地预览需要重启 Jekyll；线上需要重新构建并部署。
# YAML 使用空格缩进，不要使用 Tab；true / false 是布尔值，留空通常表示未设置。
# 建议先修改第 2、4 节的外观信息；带“谨慎修改”的选项会影响链接或构建。
# 装饰范围：标题、简介、头像、明暗模式、分享预览图、目录与首页篇数。
# 新增侧栏栏目：编辑 _tabs/；社交图标：编辑 _data/contact.yml；
# 更细的颜色、字体和间距需通过主题样式表定制，本文件不直接提供这些选项。

# ── 1. 主题与基础环境（谨慎修改） ──
# 主题名称必须与 Gemfile 中安装的主题一致。
theme: jekyll-theme-chirpy
# 是否发布未来日期的文章：false 表示等待日期到达，并在下一次构建时发布。
future: false
# 额外插件：jekyll-redirect-from 支持旧文章地址跳转。
plugins:
  - jekyll-redirect-from

# 界面语言：zh-CN 为简体中文。语言代码应对应主题 _data/locales/ 下的文件名。
# 找不到对应翻译时，主题会使用英文界面。
lang: zh-CN

# 时区：Asia/Shanghai 为北京时间。文章 date 建议同时注明 +0800。
timezone: Asia/Shanghai

# ── 2. 站点身份与介绍（常用个性化设置） ──
# SEO 元信息由 jekyll-seo-tag 生成；说明：
# https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md

# 网站标题：显示在侧栏和浏览器标题中。
title: MayL's blog

# 侧栏副标题，可写一句简短介绍。
tagline: 技术、学习与生活

description: >- # 站点描述，用于搜索引擎元信息及 RSS / Atom 订阅
  你好，我是 MayL. 这里记录我的技术实践、学习笔记与生活。

# 网站协议与域名，不包含仓库名，末尾不要加斜杠。
# 当前为 GitHub 用户主页，最终地址直接使用下方 url。
url: "https://sekirooox.github.io"

# GitHub 用户名；侧栏是否显示相应图标由 _data/contact.yml 控制。
github:
  username: sekirooox

# X / Twitter 用户名，不含 @；不使用可留空。
twitter:
  username: MayL2btr


social:
  # 默认作者及页脚版权署名，可使用昵称。
  # 指定了 author 的文章会使用 _data/authors.yml 中的作者信息。
  name: MayL
  email: ml1353578@stu2023.jnu.edu.cn # 公开联系邮箱；显示邮件图标还需配置 _data/contact.yml
  fediverse_handle: # 联邦社交账号，例如 "@username@domain.com"；不使用则留空
  links:
    # 第一项也是页脚作者姓名的跳转链接；这里只填写公开主页地址。
    - https://sekirooox.github.io/about/
    - https://github.com/sekirooox
    # 可取消下方注释并填写真实地址，添加更多社交主页。
    - https://www.facebook.com/profile.php?id=61594827508707
    - https://x.com/MayL2btr

# ── 3. 站点验证与访问统计（可选服务，需要先申请实际配置） ──
# 填各平台提供的网站所有权验证码，不是账号密码或私密 API 密钥。
# 未使用的平台保持空值；字段保留不代表对应平台仍提供验证服务。
webmaster_verifications:
  google: # Google 站点验证码
  bing: # Bing 站点验证码
  alexa: # 主题保留的 Alexa 验证字段，通常无需填写
  yandex: # Yandex 站点验证码
  baidu: # 百度站点验证码
  facebook: # Facebook 站点验证码

# 以上为站点身份及 SEO 验证信息。

# 访问统计：按选用平台填写实际 ID；留空不加载该平台的统计代码。
analytics:
  google:
    id: # Google Analytics 衡量 ID
  goatcounter:
    id: mayl # 统计后台：https://mayl.goatcounter.com；只填站点标识，无需 API 密钥
  umami:
    id: # Umami 网站 ID
    domain: # Umami 服务域名，按该平台要求填写
  matomo:
    id: # Matomo 站点 ID
    domain: # Matomo 服务域名
  cloudflare:
    id: # Cloudflare Web Analytics 前端统计令牌
  fathom:
    id: # Fathom 站点 ID

# 文章页阅读次数保持关闭；GoatCounter 仍在后台统计全站访问。
# 首页公开统计由部署流程读取汇总数据后生成，配置和维护见 docs/ANALYTICS.md。
pageviews:
  provider:

# ── 4. 外观与阅读体验（常用装饰设置） ──
# 固定浅色阅读界面；侧栏不提供主题切换。
theme_mode: light

# 媒体 CDN 地址，例如 https://cdn.com；当前本地头像和图片无需填写。
# 设置后会为以 / 开头的相对媒体路径添加 CDN 前缀，影响头像、图片、音频和视频。
# 请确保相应资源已上传到 CDN，否则可能导致图片无法显示。
cdn:

# 侧栏头像：可填本地图片路径或允许跨域访问的图片 URL。
# 例如 /assets/img/avatar.png；本地文件需要同时放入仓库。
# 同名换图后更新 ?v= 后的版本标记，避免浏览器沿用旧缓存；README 中同步更新。
avatar: /assets/img/avatar.svg?v=d3eb6bb2ca4f

# 全站默认分享预览图，写入 SEO 的 og:image 元标签；不是侧栏头像。
# 文章 Front Matter 中的 image 可覆盖此默认值。
social_preview_image: # 本地图片路径或允许跨域访问的图片 URL；例如 /assets/img/share.png

# 文章目录全局开关。单篇文章可设置 toc: false；全局关闭时不会显示目录。
toc: true

actions:
  # 在文章页显示“编辑本文”入口，方便读者前往 GitHub 提交修改。
  edit_post:
    enabled: false # 改为 true 显示入口，并填写下方 url
    url: "" # 启用后可填 https://github.com/sekirooox/sekirooox.github.io/edit/main
    # false：自动在 url 后拼接文章文件路径，各篇文章链接到自己的编辑页。
    # true：所有文章使用同一个固定 url。
    static_url: false # 可填 true 或 false

comments:
  # ── 5. 评论系统（可选，需先完成对应平台配置） ──
  # provider 为全局开关，留空表示关闭评论。
  provider: # 可选 disqus、utterances 或 giscus
  # 只需填写所选服务的配置，其他服务保持空值。
  disqus:
    shortname: # Disqus 站点简称；说明：https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # Utterances 使用 GitHub Issues 存储评论：https://utteranc.es/
  utterances:
    repo: # GitHub 仓库，格式为 用户名/仓库名
    issue_term: # 用于匹配 Issue 的规则，例如 url、pathname 或 title
  # Giscus 使用 GitHub Discussions；从 https://giscus.app/zh-CN 获取真实配置。
  giscus:
    repo: # GitHub 仓库，格式为 用户名/仓库名
    repo_id: # Giscus 提供的仓库 ID，不是仓库名称
    category: # 用于评论的 Discussions 分类名称
    category_id: # 对应的 Discussions 分类 ID
    mapping: # 文章与讨论的匹配规则，默认 pathname
    strict: # 严格匹配，默认 0
    input_position: # 输入框位置，默认 bottom，可按服务要求设为 top
    lang: # 评论界面语言，默认跟随站点 lang
    reactions_enabled: # 是否启用表情反应，默认 1

# ── 6. 静态资源与离线缓存（按需调整） ──
# 静态库自托管不同于上方的图片 CDN。启用前需准备完整的 assets/lib 资源。
# 参考：https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # 留空表示 false；资源准备完成后才改为 true
    # 仅在 enabled: true 时生效，指定哪些 Jekyll 环境使用自托管资源。
    env: # development 为本地开发，production 为生产构建；留空表示两者

pwa:
  enabled: true # PWA 功能：允许将网站安装为应用
  cache:
    enabled: false # 离线缓存；改为 false 可关闭，但需重新部署并更新旧浏览器缓存
    # 不缓存的路径列表，常用于排除同域名下其他网站的 baseurl。
    # 若页面停留在旧版本，先点击站点“更新”提示；必要时清理 Service Worker 缓存。
    deny_paths:
      # - "/example"  # 不缓存匹配 <SITE_URL>/example/* 的页面

# 网站基础路径：用户主页发布在域名根目录，因此保持为空字符串。
# 只有项目站点（例如 username.github.io/repository/）才填写 "/repository"。
baseurl: ""

# ── 7. 解析、布局与生成规则（日常写作一般无需修改） ──

# Markdown 解析器设置：处理代码高亮、脚注和 {: .light } 等属性列表。
kramdown:
  # 脚注返回正文的符号（HTML 字符实体）。
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # 代码高亮选项：https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console # 未标注代码语言时的默认值，需要时取消注释
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# 侧栏栏目集合：_tabs/ 中的页面按 order 排序，并输出为网页。
collections:
  tabs:
    output: true
    sort_by: order

# 默认 Front Matter：可在单篇文章或栏目文件中覆盖对应选项。
defaults:
  - scope:
      path: "" # 空路径表示匹配所有路径，再由 type 限定文件类型
      type: posts
    values:
      layout: post
      comments: true # 文章默认允许评论；还需上方 comments.provider 已启用
      toc: true # 文章默认显示目录，同时受全局 toc 开关控制
      # 文章永久链接。修改会改变现有文章地址，需同步维护旧链接和重定向。
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # 对应上方 collections.tabs，即 _tabs/ 中的栏目页面
    values:
      layout: page
      permalink: /:title/

# CSS 压缩方式；仅改标题、头像或文章时无需调整。
sass:
  style: compressed

# HTML 压缩配置；开发环境不压缩，便于调试。
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# 不进入生成站点的文件和目录。这不是 .gitignore，不影响 Git 是否跟踪文件。
# 新增私有草稿资料或开发目录时，可按需加入；不要排除要发布的资源目录。
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - csdn-repo
  - templates
  - vendor
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - THIRD-PARTY-NOTICES.md
  - tools
  - test
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# 分类与标签页自动生成规则；修改路径时需要检查站内链接。
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
