# 关于页联系方式；侧栏不再显示社交入口。
# social_host 由 _plugins/social-contact-generator.rb 从 _config.yml 的
# social.links 中解析；找不到对应域名时，该入口不会输出。

- type: github
  icon: "fa-brands fa-github"

- type: email
  icon: "fa-solid fa-envelope"
  noblank: true

- type: facebook
  icon: "fa-brands fa-facebook"
  social_host: facebook.com

- type: x
  icon: "fa-brands fa-x-twitter"
  social_host: x.com

