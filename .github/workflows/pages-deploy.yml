name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads the version from .ruby-version.
          bundler-cache: true

      - name: Test visitor statistics parser
        run: |
          ruby test/visitor_stats_fetch_test.rb
          ruby test/social_contact_generator_test.rb

      - name: Prepare visitor statistics
        env:
          EVENT_NAME: ${{ github.event_name }}
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
          VISITOR_STATS_START: "2026-09-26T00:00:00+08:00"
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            cp test/fixtures/visitor-stats.json _data/visitor_stats_generated.json
          else
            stats_ready=false
            for attempt in 1 2 3; do
              if ruby tools/fetch-visitor-stats.rb _data/visitor_stats_generated.json; then
                stats_ready=true
                break
              fi
              echo "GoatCounter fetch attempt ${attempt} failed."
              if (( attempt < 3 )); then
                sleep $((attempt * 5))
              fi
            done

            if [[ "$stats_ready" != "true" ]]; then
              echo "::warning::GoatCounter is unavailable; using the built-in unavailable-state data."
            fi
          fi

      - name: Build site
        run: bundle exec jekyll b -d "_site"
        env:
          JEKYLL_ENV: "production"

      - name: Verify generated site
        run: ruby test/site_output_test.rb _site

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
